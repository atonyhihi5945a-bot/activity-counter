<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動現場統計</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #f3f5f9;
      color: #1f2937;
    }
    .container { max-width: 920px; margin: auto; padding: 20px; }
    h1 { margin: 0 0 6px; }
    h2 { margin-top: 0; }
    .subtitle { color: #6b7280; margin-bottom: 20px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }
    .top-count { text-align: center; margin-bottom: 20px; }
    .top-count .number { font-size: 56px; font-weight: 800; color: #2563eb; }
    .muted { color: #6b7280; }
    .question { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
    .button-grid, .stats-grid, .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .source-btn {
      min-height: 94px;
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
    }
    .source-btn:hover { border-color: #2563eb; background: #eff6ff; }
    .source-btn:active { transform: scale(.98); }
    .source-btn:disabled { opacity: .55; cursor: wait; }
    .status {
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
      text-align: center;
    }
    .status.error { background: #fef2f2; color: #b91c1c; }
    .other-box {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }
    .other-box.show { display: block; }
    .other-row { display: flex; gap: 10px; margin-top: 10px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 17px;
    }
    .primary, .secondary, .danger {
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: white; }
    .secondary { background: #eef2ff; color: #3730a3; }
    .danger { background: #fee2e2; color: #b91c1c; }
    .actions { display: grid; gap: 10px; margin-top: 16px; }
    .stat-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 15px;
    }
    .stat-name { color: #6b7280; font-size: 14px; }
    .stat-number { font-size: 28px; font-weight: 800; margin-top: 4px; }
    .input-box label { display: block; font-weight: 700; margin-bottom: 7px; }
    .note {
      padding: 12px 14px;
      border-radius: 12px;
      background: #fffbeb;
      color: #92400e;
      font-size: 14px;
      line-height: 1.6;
    }
    .footer-link { text-align: center; font-size: 14px; margin: 18px 0; }
    .footer-link a { color: #2563eb; text-decoration: none; }
    @media(max-width: 650px) {
      .button-grid, .stats-grid, .input-grid { grid-template-columns: 1fr; }
      .container { padding: 14px; }
      .source-btn { min-height: 80px; }
      .other-row { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>活動現場統計</h1>
  <div class="subtitle">點選民眾得知活動的方式，資料會同步儲存至雲端。</div>

  <div class="card">
    <div class="top-count">
      <div class="muted">本機今日已完成來源調查</div>
      <div id="totalCount" class="number">0</div>
      <div class="muted">人</div>
    </div>

    <div class="question">這位民眾如何得知本活動？</div>

    <div class="button-grid">
      <button class="source-btn" data-source="市民卡 APP">📱 市民卡 APP</button>
      <button class="source-btn" data-source="親友">👥 親友</button>
      <button class="source-btn" data-source="路過">🚶 路過</button>
      <button class="source-btn" data-source="KOL">🎤 KOL</button>
      <button class="source-btn" data-source="實體廣告">📢 實體廣告</button>
      <button id="otherBtn" class="source-btn" type="button">➕ 其他</button>
    </div>

    <div id="otherBox" class="other-box">
      <strong>請輸入其他來源</strong>
      <div class="other-row">
        <input id="otherInput" maxlength="80" placeholder="例如：學校宣傳、官網、同事轉傳">
        <button id="confirmOther" class="primary" type="button">確認登記</button>
      </div>
    </div>

    <div id="status" class="status">系統準備完成，可以開始統計。</div>

    <div class="actions">
      <button id="undoBtn" class="secondary" type="button">↩ 復原上一筆</button>
    </div>
  </div>

  <div class="card">
    <h2>本機即時統計</h2>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-name">📱 市民卡 APP</div><div id="appCount" class="stat-number">0</div></div>
      <div class="stat-box"><div class="stat-name">👥 親友</div><div id="friendCount" class="stat-number">0</div></div>
      <div class="stat-box"><div class="stat-name">🚶 路過</div><div id="walkCount" class="stat-number">0</div></div>
      <div class="stat-box"><div class="stat-name">🎤 KOL</div><div id="kolCount" class="stat-number">0</div></div>
      <div class="stat-box"><div class="stat-name">📢 實體廣告</div><div id="adCount" class="stat-number">0</div></div>
      <div class="stat-box"><div class="stat-name">➕ 其他</div><div id="otherCount" class="stat-number">0</div></div>
    </div>
    <p class="note" style="margin-top:16px;">雲端正式資料若需要更正，請由主管登入管理後台修改；這樣可以保留完整歷史紀錄。</p>
  </div>

  <div class="card">
    <h2>今日活動數據</h2>
    <div class="input-grid">
      <div class="input-box">
        <label for="visitorCount">展覽人次</label>
        <input id="visitorCount" type="number" min="0" step="1" placeholder="例如 300">
      </div>
      <div class="input-box">
        <label for="giftCount">市民卡禮物兌換人數</label>
        <input id="giftCount" type="number" min="0" step="1" placeholder="例如 100">
      </div>
    </div>
  </div>

  <div class="card">
    <button id="newDayBtn" class="danger" style="width:100%" type="button">🗑 清除本機今日資料</button>
  </div>

  <div class="footer-link">
    <a href="./admin.html">管理後台</a>
  </div>
</div>

<script type="module">
  import { db } from "./firebase-config.js";
  import {
    collection, addDoc, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const SOURCES = ["市民卡 APP", "親友", "路過", "KOL", "實體廣告", "其他"];

  function taipeiDateKey() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Taipei",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  const dateKey = taipeiDateKey();
  const localKey = `activityLocal_${dateKey}`;
  const visitorKey = `visitorCount_${dateKey}`;
  const giftKey = `giftCount_${dateKey}`;

  let localRecords = JSON.parse(localStorage.getItem(localKey) || "[]");

  const $ = id => document.getElementById(id);
  const status = $("status");
  const otherBox = $("otherBox");
  const otherInput = $("otherInput");
  const visitorInput = $("visitorCount");
  const giftInput = $("giftCount");

  visitorInput.value = localStorage.getItem(visitorKey) || "";
  giftInput.value = localStorage.getItem(giftKey) || "";

  function saveLocal() {
    localStorage.setItem(localKey, JSON.stringify(localRecords));
  }

  function localCount(source) {
    return Math.max(0, localRecords
      .filter(x => x.source === source)
      .reduce((sum, x) => sum + (Number(x.delta) || 0), 0));
  }

  function render() {
    $("totalCount").textContent = SOURCES.reduce((s, x) => s + localCount(x), 0);
    $("appCount").textContent = localCount("市民卡 APP");
    $("friendCount").textContent = localCount("親友");
    $("walkCount").textContent = localCount("路過");
    $("kolCount").textContent = localCount("KOL");
    $("adCount").textContent = localCount("實體廣告");
    $("otherCount").textContent = localCount("其他");
  }

  async function ensureDailyDoc() {
    await setDoc(doc(db, "dailyStats", dateKey), {
      dateKey,
      updatedAt: serverTimestamp()
    }, { merge: true });
  }

  async function writeRecord(source, detail = "", delta = 1) {
    const localItem = {
      source,
      detail,
      delta,
      localTime: new Date().toLocaleString("zh-TW")
    };

    localRecords.push(localItem);
    saveLocal();
    render();

    try {
      await ensureDailyDoc();
      await addDoc(collection(db, "activityRecords"), {
        source,
        detail,
        delta,
        dateKey,
        createdAt: serverTimestamp()
      });

      status.className = "status";
      status.textContent = delta === 1
        ? `✓ 已儲存：${source}${detail ? `（${detail}）` : ""}`
        : `✓ 已送出復原：${source}`;
    } catch (error) {
      console.error(error);
      status.className = "status error";
      status.textContent = "本機已記錄，但雲端同步失敗。請確認網路或 Firebase 規則。";
    }
  }

  document.querySelectorAll(".source-btn[data-source]").forEach(btn => {
    btn.addEventListener("click", () => writeRecord(btn.dataset.source));
  });

  $("otherBtn").addEventListener("click", () => {
    otherBox.classList.toggle("show");
    if (otherBox.classList.contains("show")) otherInput.focus();
  });

  async function submitOther() {
    const detail = otherInput.value.trim();
    if (!detail) {
      status.className = "status error";
      status.textContent = "請先輸入其他來源內容。";
      return;
    }
    await writeRecord("其他", detail);
    otherInput.value = "";
    otherBox.classList.remove("show");
  }

  $("confirmOther").addEventListener("click", submitOther);
  otherInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitOther();
    }
  });

  $("undoBtn").addEventListener("click", async () => {
    const current = [...localRecords].reverse().find(x => Number(x.delta) === 1);
    if (!current) {
      status.className = "status error";
      status.textContent = "目前沒有可復原的本機登記。";
      return;
    }

    // 先避免同一筆被重複復原：移除最後一筆正向紀錄，再新增一筆 -1 修正。
    const idx = localRecords.lastIndexOf(current);
    localRecords.splice(idx, 1);
    localRecords.push({
      source: current.source,
      detail: current.detail || "",
      delta: -1,
      localTime: new Date().toLocaleString("zh-TW")
    });
    saveLocal();
    render();

    try {
      await addDoc(collection(db, "activityRecords"), {
        source: current.source,
        detail: current.detail || "",
        delta: -1,
        dateKey,
        createdAt: serverTimestamp()
      });
      status.className = "status";
      status.textContent = `✓ 已復原上一筆：${current.source}`;
    } catch (error) {
      console.error(error);
      status.className = "status error";
      status.textContent = "本機已復原，但雲端同步失敗。";
    }
  });

  let visitorTimer;
  visitorInput.addEventListener("input", () => {
    const value = Math.max(0, parseInt(visitorInput.value || "0", 10));
    localStorage.setItem(visitorKey, visitorInput.value);
    clearTimeout(visitorTimer);
    visitorTimer = setTimeout(async () => {
      try {
        await setDoc(doc(db, "dailyStats", dateKey), {
          dateKey,
          visitorCount: value,
          updatedAt: serverTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error(e);
        status.className = "status error";
        status.textContent = "展覽人次雲端同步失敗。";
      }
    }, 400);
  });

  let giftTimer;
  giftInput.addEventListener("input", () => {
    const value = Math.max(0, parseInt(giftInput.value || "0", 10));
    localStorage.setItem(giftKey, giftInput.value);
    clearTimeout(giftTimer);
    giftTimer = setTimeout(async () => {
      try {
        await setDoc(doc(db, "dailyStats", dateKey), {
          dateKey,
          giftCount: value,
          updatedAt: serverTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error(e);
        status.className = "status error";
        status.textContent = "兌換人數雲端同步失敗。";
      }
    }, 400);
  });

  $("newDayBtn").addEventListener("click", () => {
    if (!confirm("只會清除這台裝置的本機畫面資料，Firebase 歷史資料不會刪除。確定清除嗎？")) return;
    localStorage.removeItem(localKey);
    localStorage.removeItem(visitorKey);
    localStorage.removeItem(giftKey);
    localRecords = [];
    visitorInput.value = "";
    giftInput.value = "";
    render();
    status.className = "status";
    status.textContent = "本機資料已清除；雲端歷史資料仍完整保留。";
  });

  render();
</script>
</body>
</html>
