<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動現場統計</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #f3f5f9;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 { margin-bottom: 6px; }

    .subtitle {
      color: #6b7280;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .top-count {
      text-align: center;
      margin-bottom: 20px;
    }

    .top-count .number {
      font-size: 56px;
      font-weight: 800;
      color: #2563eb;
    }

    .top-count .label { color: #6b7280; }

    .question {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .source-btn {
      min-height: 96px;
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 16px;
      font-size: 21px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .source-btn:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .source-btn:active { transform: scale(0.97); }

    .other-input-box {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .other-input-box.show { display: block; }

    .other-input-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .other-input-row input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    .confirm-other-btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
      text-align: center;
      min-height: 50px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 15px;
    }

    .stat-name {
      color: #6b7280;
      font-size: 14px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
      margin-top: 4px;
    }

    .input-grid,
    .edit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .input-box label,
    .edit-box label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .input-box input,
    .edit-box input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    button.action-btn {
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .undo {
      background: #eef2ff;
      color: #3730a3;
    }

    .edit {
      background: #fef3c7;
      color: #92400e;
    }

    .save-edit {
      background: #16a34a;
      color: white;
    }

    .cancel-edit {
      background: #f3f4f6;
      color: #374151;
    }

    .report {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #fee2e2;
      color: #b91c1c;
    }

    .edit-panel {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      background: #fffbeb;
      border: 1px solid #fde68a;
    }

    .edit-panel.show { display: block; }

    .edit-help {
      margin: 0 0 14px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .report-box {
      margin-top: 15px;
      display: none;
    }

    textarea {
      width: 100%;
      height: 300px;
      padding: 15px;
      font-size: 16px;
      line-height: 1.7;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      resize: vertical;
    }

    .copy-btn {
      margin-top: 10px;
      width: 100%;
      padding: 13px;
      border: none;
      background: #16a34a;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    @media(max-width: 650px) {
      .button-grid,
      .stats-grid,
      .input-grid,
      .edit-grid {
        grid-template-columns: 1fr;
      }

      .source-btn { min-height: 82px; }
      .container { padding: 14px; }
      h1 { font-size: 25px; }

      .other-input-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>活動現場統計</h1>

  <div class="subtitle">
    點選民眾得知活動的方式，即會自動累計並儲存。
  </div>

  <div class="card">

    <div class="top-count">
      <div class="label">今日已完成來源調查</div>
      <div id="totalCount" class="number">0</div>
      <div class="label">人</div>
    </div>

    <div class="question">這位民眾如何得知本活動？</div>

    <div class="button-grid">

      <button class="source-btn" data-source="市民卡 APP">
        📱 市民卡 APP
      </button>

      <button class="source-btn" data-source="親友">
        👥 親友
      </button>

      <button class="source-btn" data-source="路過">
        🚶 路過
      </button>

      <button class="source-btn" data-source="KOL">
        🎤 KOL
      </button>

      <button class="source-btn" data-source="實體廣告">
        📢 實體廣告
      </button>

      <button id="otherBtn" class="source-btn" type="button">
        ➕ 其他
      </button>

    </div>

    <div id="otherInputBox" class="other-input-box">
      <strong>請輸入「其他」來源內容</strong>
      <div class="other-input-row">
        <input
          id="otherDetailInput"
          type="text"
          maxlength="50"
          placeholder="例如：學校宣傳、同事轉傳、官網"
        >
        <button id="confirmOtherBtn" class="confirm-other-btn" type="button">
          確認登記
        </button>
      </div>
    </div>

    <div id="status" class="status">
      可以開始統計
    </div>

    <div class="actions">
      <button id="undoBtn" class="action-btn undo">
        ↩ 復原上一筆
      </button>
    </div>

  </div>

  <div class="card">

    <h2>即時統計</h2>

    <div class="stats-grid">

      <div class="stat-box">
        <div class="stat-name">📱 市民卡 APP</div>
        <div id="appCount" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-name">👥 親友</div>
        <div id="friendCount" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-name">🚶 路過</div>
        <div id="walkCount" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-name">🎤 KOL</div>
        <div id="kolCount" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-name">📢 實體廣告</div>
        <div id="adCount" class="stat-number">0</div>
      </div>

      <div class="stat-box">
        <div class="stat-name">➕ 其他</div>
        <div id="otherCount" class="stat-number">0</div>
      </div>

    </div>

    <div class="actions">
      <button id="editStatsBtn" class="action-btn edit">
        ✏️ 手動修改即時統計
      </button>
    </div>

    <div id="editPanel" class="edit-panel">
      <p class="edit-help">
        直接輸入你希望畫面顯示的最終人數，按「儲存修改」後會同步套用到總人數與今日回報。
      </p>

      <div class="edit-grid">

        <div class="edit-box">
          <label for="editApp">市民卡 APP</label>
          <input id="editApp" type="number" min="0" step="1">
        </div>

        <div class="edit-box">
          <label for="editFriend">親友</label>
          <input id="editFriend" type="number" min="0" step="1">
        </div>

        <div class="edit-box">
          <label for="editWalk">路過</label>
          <input id="editWalk" type="number" min="0" step="1">
        </div>

        <div class="edit-box">
          <label for="editKol">KOL</label>
          <input id="editKol" type="number" min="0" step="1">
        </div>

        <div class="edit-box">
          <label for="editAd">實體廣告</label>
          <input id="editAd" type="number" min="0" step="1">
        </div>

        <div class="edit-box">
          <label for="editOther">其他</label>
          <input id="editOther" type="number" min="0" step="1">
        </div>

      </div>

      <div class="actions">
        <button id="saveEditBtn" class="action-btn save-edit">
          ✓ 儲存修改
        </button>

        <button id="cancelEditBtn" class="action-btn cancel-edit">
          取消
        </button>
      </div>
    </div>

  </div>

  <div class="card">

    <h2>今日活動數據</h2>

    <div class="input-grid">

      <div class="input-box">
        <label>展覽人次</label>
        <input
          id="visitorCount"
          type="number"
          min="0"
          placeholder="例如 300"
        >
      </div>

      <div class="input-box">
        <label>市民卡禮物兌換人數</label>
        <input
          id="giftCount"
          type="number"
          min="0"
          placeholder="例如 100"
        >
      </div>

    </div>

  </div>

  <div class="card">

    <h2>今日回報</h2>

    <div class="actions">
      <button id="generateReport" class="action-btn report">
        📋 產生今日回報文字
      </button>
    </div>

    <div id="reportBox" class="report-box">
      <textarea id="reportText" readonly></textarea>

      <button id="copyBtn" class="copy-btn">
        複製回報文字
      </button>
    </div>

  </div>

  <div class="card">

    <button
      id="clearBtn"
      class="action-btn clear"
      style="width:100%"
    >
      🗑 結束今日統計並清除全部資料
    </button>

  </div>

</div>

<script>

const SOURCES = [
  "市民卡 APP",
  "親友",
  "路過",
  "KOL",
  "實體廣告",
  "其他"
];

let records =
  JSON.parse(
    localStorage.getItem("activityRecords")
  ) || [];

let adjustments =
  JSON.parse(
    localStorage.getItem("activityAdjustments")
  ) || {};

SOURCES.forEach(source => {
  if (!Number.isFinite(Number(adjustments[source]))) {
    adjustments[source] = 0;
  } else {
    adjustments[source] = Number(adjustments[source]);
  }
});

const totalCount =
  document.getElementById("totalCount");

const statusBox =
  document.getElementById("status");

const visitorInput =
  document.getElementById("visitorCount");

const giftInput =
  document.getElementById("giftCount");

const otherBtn =
  document.getElementById("otherBtn");

const otherInputBox =
  document.getElementById("otherInputBox");

const otherDetailInput =
  document.getElementById("otherDetailInput");

const confirmOtherBtn =
  document.getElementById("confirmOtherBtn");

const editPanel =
  document.getElementById("editPanel");

visitorInput.value =
  localStorage.getItem("visitorCount") || "";

giftInput.value =
  localStorage.getItem("giftCount") || "";

function saveRecords() {
  localStorage.setItem(
    "activityRecords",
    JSON.stringify(records)
  );
}

function saveAdjustments() {
  localStorage.setItem(
    "activityAdjustments",
    JSON.stringify(adjustments)
  );
}

function getBaseCount(source) {
  return records.filter(
    item => item.source === source
  ).length;
}

function getCount(source) {
  const value =
    getBaseCount(source) +
    (Number(adjustments[source]) || 0);

  return Math.max(0, value);
}

function getTotalCount() {
  return SOURCES.reduce(
    (sum, source) => sum + getCount(source),
    0
  );
}

function addRecord(source, detail = "") {

  records.push({
    source: source,
    detail: detail,
    time: new Date().toLocaleString("zh-TW")
  });

  saveRecords();
  render();

  const currentNumber = getTotalCount();

  if (source === "其他" && detail) {
    statusBox.textContent =
      "✓ 第 " +
      currentNumber +
      " 位已登記：其他（" +
      detail +
      "），請繼續下一位";
  } else {
    statusBox.textContent =
      "✓ 第 " +
      currentNumber +
      " 位已登記：" +
      source +
      "，請繼續下一位";
  }
}

document
  .querySelectorAll(".source-btn[data-source]")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {
        addRecord(this.dataset.source);
      }
    );

  });

otherBtn.addEventListener(
  "click",
  function() {
    otherInputBox.classList.toggle("show");

    if (otherInputBox.classList.contains("show")) {
      otherDetailInput.focus();
    }
  }
);

function submitOther() {
  const detail =
    otherDetailInput.value.trim();

  if (!detail) {
    statusBox.textContent =
      "請先輸入「其他」來源內容";
    otherDetailInput.focus();
    return;
  }

  addRecord("其他", detail);

  otherDetailInput.value = "";
  otherInputBox.classList.remove("show");
}

confirmOtherBtn.addEventListener(
  "click",
  submitOther
);

otherDetailInput.addEventListener(
  "keydown",
  function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      submitOther();
    }
  }
);

function render() {

  totalCount.textContent =
    getTotalCount();

  document.getElementById(
    "appCount"
  ).textContent =
    getCount("市民卡 APP");

  document.getElementById(
    "friendCount"
  ).textContent =
    getCount("親友");

  document.getElementById(
    "walkCount"
  ).textContent =
    getCount("路過");

  document.getElementById(
    "kolCount"
  ).textContent =
    getCount("KOL");

  document.getElementById(
    "adCount"
  ).textContent =
    getCount("實體廣告");

  document.getElementById(
    "otherCount"
  ).textContent =
    getCount("其他");
}

document
  .getElementById("undoBtn")
  .addEventListener(
    "click",
    function() {

      if (records.length === 0) {
        statusBox.textContent =
          "目前沒有一般登記資料可以復原；若要調整手動修改的數字，請使用「手動修改即時統計」。";
        return;
      }

      const removed =
        records.pop();

      saveRecords();
      render();

      statusBox.textContent =
        "已復原上一筆：" +
        removed.source +
        (removed.detail ? "（" + removed.detail + "）" : "");
    }
  );

visitorInput.addEventListener(
  "input",
  function() {
    localStorage.setItem(
      "visitorCount",
      this.value
    );
  }
);

giftInput.addEventListener(
  "input",
  function() {
    localStorage.setItem(
      "giftCount",
      this.value
    );
  }
);

document
  .getElementById("editStatsBtn")
  .addEventListener(
    "click",
    function() {

      document.getElementById("editApp").value =
        getCount("市民卡 APP");

      document.getElementById("editFriend").value =
        getCount("親友");

      document.getElementById("editWalk").value =
        getCount("路過");

      document.getElementById("editKol").value =
        getCount("KOL");

      document.getElementById("editAd").value =
        getCount("實體廣告");

      document.getElementById("editOther").value =
        getCount("其他");

      editPanel.classList.toggle("show");
    }
  );

document
  .getElementById("cancelEditBtn")
  .addEventListener(
    "click",
    function() {
      editPanel.classList.remove("show");
    }
  );

document
  .getElementById("saveEditBtn")
  .addEventListener(
    "click",
    function() {

      const targets = {
        "市民卡 APP": Number(document.getElementById("editApp").value),
        "親友": Number(document.getElementById("editFriend").value),
        "路過": Number(document.getElementById("editWalk").value),
        "KOL": Number(document.getElementById("editKol").value),
        "實體廣告": Number(document.getElementById("editAd").value),
        "其他": Number(document.getElementById("editOther").value)
      };

      for (const source of SOURCES) {
        if (
          !Number.isFinite(targets[source]) ||
          targets[source] < 0 ||
          !Number.isInteger(targets[source])
        ) {
          alert("請輸入 0 以上的整數。");
          return;
        }
      }

      SOURCES.forEach(source => {
        adjustments[source] =
          targets[source] -
          getBaseCount(source);
      });

      saveAdjustments();
      render();

      editPanel.classList.remove("show");

      statusBox.textContent =
        "✓ 即時統計已完成手動修改";
    }
  );

function getOtherDetailSummary() {

  const details = {};

  records
    .filter(item =>
      item.source === "其他" &&
      item.detail
    )
    .forEach(item => {

      const detail =
        item.detail.trim();

      if (!detail) return;

      details[detail] =
        (details[detail] || 0) + 1;
    });

  const entries =
    Object.entries(details);

  if (entries.length === 0) {
    return "";
  }

  return entries
    .map(([name, count]) =>
      `${name} ${count} 人`
    )
    .join("、");
}

document
  .getElementById("generateReport")
  .addEventListener(
    "click",
    function() {

      const today =
        new Date().toLocaleDateString("zh-TW");

      const total =
        getTotalCount();

      const app =
        getCount("市民卡 APP");

      const friend =
        getCount("親友");

      const walk =
        getCount("路過");

      const kol =
        getCount("KOL");

      const ad =
        getCount("實體廣告");

      const other =
        getCount("其他");

      const otherDetail =
        getOtherDetailSummary();

      const visitor =
        visitorInput.value || 0;

      const gift =
        giftInput.value || 0;

      let text =
`${today} 活動統計

今日展覽人次：${visitor} 人
市民卡禮物兌換：${gift} 人

活動來源調查：${total} 人

市民卡 APP：${app} 人
親友：${friend} 人
路過：${walk} 人
KOL：${kol} 人
實體廣告：${ad} 人
其他：${other} 人`;

      if (otherDetail) {
        text += `\n其他明細：${otherDetail}`;
      }

      document.getElementById(
        "reportText"
      ).value = text;

      document.getElementById(
        "reportBox"
      ).style.display = "block";
    }
  );

document
  .getElementById("copyBtn")
  .addEventListener(
    "click",
    async function() {

      const text =
        document.getElementById(
          "reportText"
        ).value;

      try {
        await navigator.clipboard.writeText(text);

        this.textContent =
          "✓ 已複製，可以貼到群組";
      }
      catch {
        document.getElementById(
          "reportText"
        ).select();

        this.textContent =
          "請手動複製上方文字";
      }
    }
  );

document
  .getElementById("clearBtn")
  .addEventListener(
    "click",
    function() {

      const confirmClear =
        confirm(
          "確定今天的數字都已經回報完成嗎？\n\n按下確定後，今日所有統計資料都會歸零。"
        );

      if (!confirmClear) {
        return;
      }

      records = [];

      adjustments = {};

      SOURCES.forEach(source => {
        adjustments[source] = 0;
      });

      localStorage.removeItem(
        "activityRecords"
      );

      localStorage.removeItem(
        "activityAdjustments"
      );

      localStorage.removeItem(
        "visitorCount"
      );

      localStorage.removeItem(
        "giftCount"
      );

      visitorInput.value = "";
      giftInput.value = "";
      otherDetailInput.value = "";

      otherInputBox.classList.remove("show");
      editPanel.classList.remove("show");

      document.getElementById(
        "reportBox"
      ).style.display = "none";

      render();

      statusBox.textContent =
        "今日資料已清除，可以開始新一天統計";
    }
  );

render();

</script>

</body>
</html>
