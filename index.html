<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動現場統計</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #f3f5f9;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .top-count {
      text-align: center;
      margin-bottom: 20px;
    }

    .top-count .number {
      font-size: 56px;
      font-weight: 800;
      color: #2563eb;
    }

    .top-count .label {
      color: #6b7280;
    }

    .question {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .source-btn {
      min-height: 105px;
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .source-btn:hover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .source-btn:active {
      transform: scale(0.97);
    }

    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
      text-align: center;
      min-height: 50px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 15px;
    }

    .stat-name {
      color: #6b7280;
      font-size: 14px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
      margin-top: 4px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .input-box label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    .input-box input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    button.action-btn {
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .undo {
      background: #eef2ff;
      color: #3730a3;
    }

    .report {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #fee2e2;
      color: #b91c1c;
    }

    .report-box {
      margin-top: 15px;
      display: none;
    }

    textarea {
      width: 100%;
      height: 250px;
      padding: 15px;
      font-size: 16px;
      line-height: 1.7;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      resize: vertical;
    }

    .copy-btn {
      margin-top: 10px;
      width: 100%;
      padding: 13px;
      border: none;
      background: #16a34a;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    @media(max-width: 650px) {

      .button-grid,
      .stats-grid,
      .input-grid {
        grid-template-columns: 1fr;
      }

      .source-btn {
        min-height: 85px;
      }

      .container {
        padding: 14px;
      }

      h1 {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <h1>活動現場統計</h1>

  <div class="subtitle">
    點選民眾得知活動的方式，即會自動累計並儲存。
  </div>


  <!-- 來源統計 -->

  <div class="card">

    <div class="top-count">

      <div class="label">
        今日已完成來源調查
      </div>

      <div
        id="totalCount"
        class="number"
      >
        0
      </div>

      <div class="label">
        人
      </div>

    </div>


    <div class="question">
      這位民眾如何得知本活動？
    </div>


    <div class="button-grid">

      <button
        class="source-btn"
        data-source="市民卡 APP"
      >
        📱 市民卡 APP
      </button>

      <button
        class="source-btn"
        data-source="親友"
      >
        👥 親友
      </button>

      <button
        class="source-btn"
        data-source="路過"
      >
        🚶 路過
      </button>

      <button
        class="source-btn"
        data-source="其他"
      >
        ➕ 其他
      </button>

    </div>


    <div
      id="status"
      class="status"
    >
      可以開始統計
    </div>


    <div class="actions">

      <button
        id="undoBtn"
        class="action-btn undo"
      >
        ↩ 復原上一筆
      </button>

    </div>

  </div>



  <!-- 即時統計 -->

  <div class="card">

    <h2>
      即時統計
    </h2>


    <div class="stats-grid">

      <div class="stat-box">

        <div class="stat-name">
          📱 市民卡 APP
        </div>

        <div
          id="appCount"
          class="stat-number"
        >
          0
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-name">
          👥 親友
        </div>

        <div
          id="friendCount"
          class="stat-number"
        >
          0
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-name">
          🚶 路過
        </div>

        <div
          id="walkCount"
          class="stat-number"
        >
          0
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-name">
          ➕ 其他
        </div>

        <div
          id="otherCount"
          class="stat-number"
        >
          0
        </div>

      </div>

    </div>

  </div>



  <!-- 其他每日資料 -->

  <div class="card">

    <h2>
      今日活動數據
    </h2>

    <div class="input-grid">

      <div class="input-box">

        <label>
          展覽人次
        </label>

        <input
          id="visitorCount"
          type="number"
          min="0"
          placeholder="例如 300"
        >

      </div>


      <div class="input-box">

        <label>
          市民卡禮物兌換人數
        </label>

        <input
          id="giftCount"
          type="number"
          min="0"
          placeholder="例如 100"
        >

      </div>

    </div>

  </div>



  <!-- 回報 -->

  <div class="card">

    <h2>
      今日回報
    </h2>

    <div class="actions">

      <button
        id="generateReport"
        class="action-btn report"
      >
        📋 產生今日回報文字
      </button>

    </div>


    <div
      id="reportBox"
      class="report-box"
    >

      <textarea
        id="reportText"
        readonly
      ></textarea>

      <button
        id="copyBtn"
        class="copy-btn"
      >
        複製回報文字
      </button>

    </div>

  </div>



  <!-- 清除資料 -->

  <div class="card">

    <button
      id="clearBtn"
      class="action-btn clear"
      style="width:100%"
    >
      🗑 結束今日統計並清除全部資料
    </button>

  </div>

</div>



<script>

let records =
  JSON.parse(
    localStorage.getItem("activityRecords")
  ) || [];


let visitorCount =
  localStorage.getItem("visitorCount") || "";


let giftCount =
  localStorage.getItem("giftCount") || "";


const totalCount =
  document.getElementById("totalCount");


const statusBox =
  document.getElementById("status");


const visitorInput =
  document.getElementById("visitorCount");


const giftInput =
  document.getElementById("giftCount");


visitorInput.value =
  visitorCount;


giftInput.value =
  giftCount;



function saveRecords() {

  localStorage.setItem(
    "activityRecords",
    JSON.stringify(records)
  );

}



function addRecord(source) {

  records.push({

    source: source,

    time:
      new Date().toLocaleString("zh-TW")

  });


  saveRecords();

  render();


  statusBox.textContent =
    "✓ 第 " +
    records.length +
    " 位已登記：" +
    source +
    "，請繼續下一位";

}



document
  .querySelectorAll(".source-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      function() {

        addRecord(
          this.dataset.source
        );

      }
    );

  });



function getCount(source) {

  return records.filter(
    item =>
      item.source === source
  ).length;

}



function render() {

  totalCount.textContent =
    records.length;


  document.getElementById(
    "appCount"
  ).textContent =
    getCount("市民卡 APP");


  document.getElementById(
    "friendCount"
  ).textContent =
    getCount("親友");


  document.getElementById(
    "walkCount"
  ).textContent =
    getCount("路過");


  document.getElementById(
    "otherCount"
  ).textContent =
    getCount("其他");

}



document
  .getElementById("undoBtn")
  .addEventListener(
    "click",
    function() {

      if (
        records.length === 0
      ) {

        statusBox.textContent =
          "目前沒有資料可以復原";

        return;

      }


      const removed =
        records.pop();


      saveRecords();

      render();


      statusBox.textContent =
        "已復原上一筆：" +
        removed.source;

    }
  );



visitorInput.addEventListener(
  "input",
  function() {

    localStorage.setItem(
      "visitorCount",
      this.value
    );

  }
);



giftInput.addEventListener(
  "input",
  function() {

    localStorage.setItem(
      "giftCount",
      this.value
    );

  }
);



document
  .getElementById(
    "generateReport"
  )
  .addEventListener(
    "click",
    function() {

      const today =
        new Date()
          .toLocaleDateString(
            "zh-TW"
          );


      const total =
        records.length;


      const app =
        getCount(
          "市民卡 APP"
        );


      const friend =
        getCount(
          "親友"
        );


      const walk =
        getCount(
          "路過"
        );


      const other =
        getCount(
          "其他"
        );


      const visitor =
        visitorInput.value || 0;


      const gift =
        giftInput.value || 0;


      const text =

`${today} 活動統計

今日展覽人次：${visitor} 人
市民卡禮物兌換：${gift} 人

活動來源調查：${total} 人

市民卡 APP：${app} 人
親友：${friend} 人
路過：${walk} 人
其他：${other} 人`;


      document.getElementById(
        "reportText"
      ).value =
        text;


      document.getElementById(
        "reportBox"
      ).style.display =
        "block";

    }
  );



document
  .getElementById(
    "copyBtn"
  )
  .addEventListener(
    "click",
    async function() {

      const text =
        document.getElementById(
          "reportText"
        ).value;


      try {

        await navigator.clipboard.writeText(
          text
        );


        this.textContent =
          "✓ 已複製，可以貼到群組";

      }

      catch {

        document.getElementById(
          "reportText"
        ).select();

        this.textContent =
          "請手動複製上方文字";

      }

    }
  );



document
  .getElementById(
    "clearBtn"
  )
  .addEventListener(
    "click",
    function() {

      const confirmClear =
        confirm(
          "確定今天的數字都已經回報完成嗎？\n\n按下確定後，今日所有統計資料都會歸零。"
        );


      if (
        !confirmClear
      ) {

        return;

      }


      records = [];


      localStorage.removeItem(
        "activityRecords"
      );


      localStorage.removeItem(
        "visitorCount"
      );


      localStorage.removeItem(
        "giftCount"
      );


      visitorInput.value =
        "";


      giftInput.value =
        "";


      document.getElementById(
        "reportBox"
      ).style.display =
        "none";


      render();


      statusBox.textContent =
        "今日資料已清除，可以開始新一天統計";

    }
  );



render();

</script>

</body>
</html>
